<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Kalkulyatori</title>
    <style>
        /* Asosiy fon va matn rangi */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c; /* To'q ko'k-kulrang (dark navy) */
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
            color: #e2e8f0; /* Asosiy matn rangi (och kulrang-oq) */
        }

        .calculator {
            background: #1e293b; /* Kalkulyator kartasi foni (bir oz yorqinroq to'q ko'k) */
            width: 100%;
            max-width: 380px;
            padding: 20px;
            border-radius: 12px; /* Yumaloq burchaklar */
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid #334155; /* Ingichka chegara */
            box-sizing: border-box;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffffff; /* Sarlavha oq rangda */
        }

        .form-group {
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .col {
            flex: 1;
            min-width: 0;
        }

        /* Yorliqlar (Ustki yozuvlar) */
        label {
            display: block;
            font-size: 11px;
            color: #94a3b8; /* Och kulrang */
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Kiritish maydonchalari (Input va Select) */
        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a; /* Qoraytirilgan fon */
            border: 1px solid #334155; /* Ingichka chegara */
            border-radius: 8px; /* Yumaloq burchak */
            font-size: 15px;
            color: #f8fafc; /* Kiritilgan matn oq */
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        /* Fokus (tanlanganda) holati */
        input:focus, select:focus {
            border-color: #3b82f6; /* Ko'k chegara */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* O'chirilgan (disabled) maydonlar */
        input:disabled, select:disabled {
            background-color: #1e293b;
            color: #64748b;
            cursor: not-allowed;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Valyuta va o'lchov birliklari (%) */
        .input-group .suffix {
            position: absolute;
            right: 12px;
            color: #94a3b8;
            font-size: 13px;
            pointer-events: none; /* Bosishni to'sib qo'ymaslik uchun */
        }

        /* Checkbox qismi */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 15px;
            margin-top: 5px;
            white-space: nowrap;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            flex-shrink: 0;
            accent-color: #3b82f6; /* Checkbox rangi */
            cursor: pointer;
        }

        .checkbox-group label {
            text-transform: none;
            margin: 0;
            font-weight: normal;
            font-size: 13px;
            color: #cbd5e1;
            cursor: pointer;
        }

        /* Narx ma'lumoti qatori */
        .price-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 15px;
        }

        /* Natija qutisi */
        .result-box {
            background-color: #0f172a; /* Qoraytirilgan natija qutisi */
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
        }

        .result-box h3 {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Lot natijasi */
        .lot-result {
            font-size: 32px;
            font-weight: bold;
            color: #60a5fa; /* Yorqin ko'k rang */
            margin-bottom: 15px;
        }

        .lot-result span {
            font-size: 15px;
            font-weight: normal;
            color: #cbd5e1;
        }

        /* Natija detallari */
        .result-details {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .result-details span:last-child {
            font-weight: bold;
            color: #f8fafc; /* Qiymatlar oq rangda */
        }

        /* Ogohlantirish matni */
        .warning {
            font-size: 11px;
            color: #64748b;
            margin-top: 15px;
            border-top: 1px solid #334155;
            padding-top: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Lot kalkulyatori</h2>

    <div class="form-group">
        <label>VALYUTA JUFTLIGI</label>
        <select id="pair" disabled>
            <option>XAU/USD</option>
        </select>
    </div>

    <div class="row form-group">
        <div class="col">
            <label>HISOB VALYUTASI</label>
            <select id="accountCurrency" disabled>
                <option>USD</option>
            </select>
        </div>
        <div class="col">
            <label>HISOB HAJMI</label>
            <input type="number" id="accountSize" value="40">
        </div>
    </div>

    <div class="row form-group">
        <div class="col">
            <label>RISK %</label>
            <div class="input-group">
                <input type="number" id="riskPercent" value="50" step="0.1">
                <span class="suffix">%</span>
            </div>
        </div>
        <div class="col">
            <label>RISK $</label>
            <div class="input-group">
                <input type="number" id="riskAmount" value="20" step="0.1">
                <span class="suffix">USD</span>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>STOP-LOSS</label>
        <div class="input-group">
            <input type="number" id="stopLoss" value="10" step="0.1">
            <span class="suffix">punkt</span>
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="spread">
        <label for="spread">Spredni hisobga olish</label>
    </div>

    <div class="price-info">
        <span>XAU/USD</span>
        <span>3737.90000</span>
    </div>

    <div class="result-box">
        <h3>NATIJA</h3>
        <div class="lot-result"><span id="resultLot">2,00</span> <span>lot</span></div>
        
        <div class="result-details">
            <span>Punkt qiymati</span>
            <span id="pointValue">1.00 USD</span>
        </div>
        <div class="result-details">
            <span>Samarali stop</span>
            <span id="effectiveStop">10.0 punkt</span>
        </div>
        <div class="result-details">
            <span>Hisoblangan risk</span>
            <span id="calculatedRisk">20.00 USD</span>
        </div>
    </div>

    <div class="warning">
        Brokerning minimal hajmi va qadami noma'lum.<br>
        Ko'rsatilgan hajmni ruxsat etilgan qadamgacha pastga yaxlitlang: yuqoriga yaxlitlash riskni oshiradi.
    </div>
</div>

<script>
    const accountSizeInput = document.getElementById('accountSize');
    const riskPercentInput = document.getElementById('riskPercent');
    const riskAmountInput = document.getElementById('riskAmount');
    const stopLossInput = document.getElementById('stopLoss');

    const resultLot = document.getElementById('resultLot');
    const pointValue = document.getElementById('pointValue');
    const effectiveStop = document.getElementById('effectiveStop');
    const calculatedRisk = document.getElementById('calculatedRisk');

    const valuePerPointPerLot = 1.00; 

    function calculate() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let riskAmount = parseFloat(riskAmountInput.value) || 0;
        let stopLoss = parseFloat(stopLossInput.value) || 1; 

        let lot = riskAmount / (stopLoss * valuePerPointPerLot);

        resultLot.textContent = lot.toFixed(2).replace('.', ',');
        effectiveStop.textContent = stopLoss.toFixed(1) + ' punkt';
        calculatedRisk.textContent = riskAmount.toFixed(2) + ' USD';
        
        let currentPointValue = lot * valuePerPointPerLot;
        pointValue.textContent = currentPointValue.toFixed(2) + ' USD';
    }

    riskPercentInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let newRiskAmount = (accountSize * riskPercent) / 100;
        riskAmountInput.value = newRiskAmount.toFixed(2);
        calculate();
    });

    riskAmountInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskAmount = parseFloat(riskAmountInput.value) || 0;
        if (accountSize > 0) {
            let newRiskPercent = (riskAmount / accountSize) * 100;
            riskPercentInput.value = newRiskPercent.toFixed(2);
        }
        calculate();
    });

    accountSizeInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let newRiskAmount = (accountSize * riskPercent) / 100;
        riskAmountInput.value = newRiskAmount.toFixed(2);
        calculate();
    });

    stopLossInput.addEventListener('input', calculate);

    calculate();
</script>

</body>
</html>
