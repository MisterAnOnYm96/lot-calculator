<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Kalkulyatori</title>
    <style>
        /* Qorong'u rejim uchun asosiy sozlamalar */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #12161f; /* Skrinshotdagi to'q fon rangi */
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
            color: #ffffff;
        }
        
        .calculator {
            background: transparent;
            width: 100%;
            max-width: 400px;
            padding: 10px 5px;
            box-sizing: border-box;
        }

        /* Sarlavhalar va labellarning rangi */
        label, .label-text {
            display: block;
            font-size: 12px;
            color: #8b95a5; /* Och kulrang */
            margin-bottom: 6px;
        }

        /* Barcha kiritish maydonchalari (input, select) dizayni */
        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: #1c212b; /* Katakcha foni */
            border: 1px solid #2e3543; /* Katakcha chegarasi */
            border-radius: 12px; /* Yumaloq burchaklar */
            font-size: 16px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            -webkit-appearance: none; /* iOS dagi standart dizaynni o'chirish */
            appearance: none;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
        }

        /* Select uchun maxsus strelka (o'q) */
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b95a5%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 16px top 50%;
            background-size: 10px auto;
        }
        
        /* O'chirilgan (disabled) maydonlar */
        input:disabled, select:disabled {
            background-color: #151921;
            color: #8b95a5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        /* Ustunlar (qatorlar) */
        .row {
            display: flex;
            gap: 12px;
        }
        .col {
            flex: 1;
            min-width: 0;
        }

        /* BUY / SELL tugmalari dizayni */
        .toggle-group {
            display: flex;
            background-color: #1c212b;
            border: 1px solid #2e3543;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            color: #8b95a5;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-btn.active-buy {
            background-color: rgba(34, 197, 94, 0.15); /* Yashil fon */
            color: #22c55e; /* Yashil matn */
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* Natija bloki (Foyda / Zarar) */
        .result-box {
            background-color: #1c212b;
            border: 1px solid #2e3543;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 13px;
            color: #8b95a5;
        }
        .result-badge {
            background-color: #2e3543;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #8b95a5;
        }
        .lot-result {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
        }
        
        /* Natija ichidagi qatorlar */
        .result-details {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            color: #8b95a5;
        }
        .result-details span:last-child {
            font-weight: bold;
            color: #ffffff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #22c55e; /* Checkbox rangi */
            margin: 0;
            border-radius: 4px;
        }
        .checkbox-group label {
            margin: 0;
            font-size: 14px;
            color: #ffffff;
            cursor: pointer;
        }

        .warning {
            font-size: 11px;
            color: #6c757d;
            margin-top: 20px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Instrument (Valyuta juftligi) -->
    <div class="form-group">
        <label class="label-text">Instrument</label>
        <select id="pair">
            <option>XAU/USD</option>
        </select>
    </div>

    <!-- BUY / SELL -->
    <label class="label-text">Yo'nalish</label>
    <div class="toggle-group">
        <div class="toggle-btn active-buy">BUY</div>
        <div class="toggle-btn">SELL</div>
    </div>

    <!-- Depozit va Lot hajmi -->
    <div class="row form-group">
        <div class="col">
            <label class="label-text">Depozit ($)</label>
            <input type="number" id="accountSize" value="40">
        </div>
        <div class="col">
            <label class="label-text">Lot hajmi</label>
            <input type="number" id="lotSizeInput" placeholder="0,01">
        </div>
        <div class="col">
            <label class="label-text">TP/SL</label>
            <input type="text" placeholder="">
        </div>
    </div>

    <!-- Narxlar (Ochilish va Yopilish) -->
    <div class="row form-group">
        <div class="col">
            <label class="label-text">Ochilish narxi</label>
            <input type="text" placeholder="0000,000" disabled>
        </div>
        <div class="col">
            <label class="label-text">Yopilish narxi</label>
            <input type="text" placeholder="0000,000" disabled>
        </div>
    </div>

    <!-- Stop Loss va Take Profit -->
    <div class="row form-group">
        <div class="col">
            <label class="label-text">Stop Loss</label>
            <input type="text" id="stopLoss" value="10" placeholder="0000,000">
        </div>
        <div class="col">
            <label class="label-text">Take Profit</label>
            <input type="text" placeholder="0000,000">
        </div>
    </div>

    <!-- Hisoblash sozlamalari (Oldingi qismdan) -->
    <div class="row form-group" style="margin-top: 25px;">
         <div class="col">
            <label class="label-text">Risk %</label>
            <input type="number" id="riskPercent" value="50" step="0.1">
        </div>
        <div class="col">
            <label class="label-text">Risk ($)</label>
            <input type="number" id="riskAmount" value="20" step="0.1">
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="spread">
        <label for="spread">Spredni hisobga olish</label>
    </div>

    <!-- Natija (Foyda / Zarar) -->
    <div class="result-box">
        <div class="result-header">
            <span class="result-title">Foyda / Zarar (Natija)</span>
            <span class="result-badge">0,00%</span>
        </div>
        
        <div class="lot-result">$<span id="calculatedRisk">0,00</span></div>
        
        <div class="result-details">
            <span>XAU/USD (Narx)</span>
            <span>3737.90000</span>
        </div>
        <div class="result-details">
            <span>Punkt qiymati</span>
            <span id="pointValue">1.00 USD</span>
        </div>
        <div class="result-details">
            <span>Samarali stop</span>
            <span id="effectiveStop">10.0 punkt</span>
        </div>
        <div class="result-details">
            <span>Hisoblangan lot</span>
            <span id="resultLot">2,00 lot</span>
        </div>
    </div>

    <div class="warning">
        Minimal hajm va broker qadami noma'lum.<br>Hajmni pastga qarab yaxlitlang.
    </div>
</div>

<script>
    // Elementlarni olish
    const accountSizeInput = document.getElementById('accountSize');
    const riskPercentInput = document.getElementById('riskPercent');
    const riskAmountInput = document.getElementById('riskAmount');
    const stopLossInput = document.getElementById('stopLoss');
    const lotSizeInput = document.getElementById('lotSizeInput');

    const resultLot = document.getElementById('resultLot');
    const pointValue = document.getElementById('pointValue');
    const effectiveStop = document.getElementById('effectiveStop');
    const calculatedRisk = document.getElementById('calculatedRisk');

    // XAU/USD uchun 1 lot = 100 untsiya. 1 punkt = 0.01 narx o'zgarishi.
    const valuePerPointPerLot = 1.00; 

    function calculate() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let riskAmount = parseFloat(riskAmountInput.value) || 0;
        let stopLoss = parseFloat(stopLossInput.value) || 1; 

        // Lot hajmini hisoblash formulasi
        let lot = riskAmount / (stopLoss * valuePerPointPerLot);

        // Natijalarni yangilash
        resultLot.textContent = lot.toFixed(2).replace('.', ',') + ' lot';
        effectiveStop.textContent = stopLoss.toFixed(1) + ' punkt';
        calculatedRisk.textContent = riskAmount.toFixed(2).replace('.', ',');
        
        // Katta harf bilan yozilgan Lot hajmi maydoniga avtomatik qo'yish
        lotSizeInput.value = lot.toFixed(2).replace('.', ',');
        
        // Punkt narxi
        let currentPointValue = lot * valuePerPointPerLot;
        pointValue.textContent = currentPointValue.toFixed(2) + ' USD';
    }

    // Hodisalar (Event Listeners)
    riskPercentInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        riskAmountInput.value = ((accountSize * riskPercent) / 100).toFixed(2);
        calculate();
    });

    riskAmountInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskAmount = parseFloat(riskAmountInput.value) || 0;
        if (accountSize > 0) {
            riskPercentInput.value = ((riskAmount / accountSize) * 100).toFixed(2);
        }
        calculate();
    });

    accountSizeInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        riskAmountInput.value = ((accountSize * riskPercent) / 100).toFixed(2);
        calculate();
    });

    stopLossInput.addEventListener('input', calculate);

    // Dastlabki holatda hisoblash
    calculate();
</script>

</body>
</html>
