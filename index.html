<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Kalkulyatori</title>
    <style>
        /* Asosiy fon rangi (Dark Navy) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c; /* To'q ko'k-kulrang */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }

        /* Kalkulyator oynasi (Karta) */
        .calculator {
            background-color: #2d3748; /* Kartaning foni, fondan biroz yorqinroq */
            width: 100%;
            max-width: 380px;
            padding: 20px;
            border-radius: 16px; /* Katta yumaloq burchak */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); /* Chuqur soya */
            border: 1px solid #4a5568;
            box-sizing: border-box;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #f7fafc;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .col {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            font-size: 11px;
            color: #a0aec0; /* Och kulrang matn */
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Kiritish maydonchalari va Selectlar */
        input, select {
            width: 100%;
            padding: 12px 14px;
            background-color: #1a202c; /* Maydonlar foni */
            border: 1px solid #4a5568; /* Hoshiya */
            border-radius: 10px; /* Yumaloq burchak */
            font-size: 15px;
            color: #e2e8f0; /* Matn rangi */
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Fokus bo'lgandagi holat */
        input:focus, select:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.2);
        }

        /* O'chirilgan (disabled) maydonlar */
        input:disabled, select:disabled {
            background-color: #2d3748;
            color: #718096;
            cursor: not-allowed;
        }

        /* Orqa fondagi strelkalarni (select uchun) o'zgartirish */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a0aec0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group .suffix {
            position: absolute;
            right: 14px;
            color: #a0aec0;
            font-size: 13px;
            pointer-events: none;
        }

        /* Checkbox qismi */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #cbd5e0;
            margin-bottom: 15px;
            margin-top: 5px;
            white-space: nowrap;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #3182ce; /* Checkbox rangi */
            cursor: pointer;
            flex-shrink: 0;
            border-radius: 4px;
        }

        .checkbox-group label {
            text-transform: none;
            margin: 0;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            color: #cbd5e0;
        }

        /* Narx ma'lumoti */
        .price-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a0aec0;
            padding: 12px 0;
            border-top: 1px dashed #4a5568;
            border-bottom: 1px dashed #4a5568;
            margin-bottom: 15px;
        }

        /* Natija qutisi */
        .result-box {
            background-color: #1a202c; /* Natija foni to'qroq */
            border: 1px solid #4a5568;
            border-radius: 12px;
            padding: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .result-box h3 {
            font-size: 11px;
            color: #a0aec0;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .lot-result {
            font-size: 32px;
            font-weight: bold;
            color: #63b3ed; /* Yorqin ko'k rang */
            margin-bottom: 15px;
        }

        .lot-result span {
            font-size: 16px;
            font-weight: normal;
            color: #cbd5e0;
        }

        .result-details {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #a0aec0;
        }

        .result-details span:last-child {
            font-weight: bold;
            color: #e2e8f0;
        }

        /* Ogohlantirish matni */
        .warning {
            font-size: 10px;
            color: #718096;
            margin-top: 15px;
            border-top: 1px solid #4a5568;
            padding-top: 10px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Lot kalkulyatori</h2>

    <div class="form-group">
        <label>VALYUTA JUFTLIGI</label>
        <select id="pair" disabled>
            <option>XAU/USD</option>
        </select>
    </div>

    <div class="row form-group">
        <div class="col">
            <label>HISOB VALYUTASI</label>
            <select id="accountCurrency" disabled>
                <option>USD</option>
            </select>
        </div>
        <div class="col">
            <label>HISOB HAJMI</label>
            <input type="number" id="accountSize" value="40">
        </div>
    </div>

    <div class="row form-group">
        <div class="col">
            <label>RISK %</label>
            <div class="input-group">
                <input type="number" id="riskPercent" value="50" step="0.1">
                <span class="suffix">%</span>
            </div>
        </div>
        <div class="col">
            <label>RISK $</label>
            <div class="input-group">
                <input type="number" id="riskAmount" value="20" step="0.1">
                <span class="suffix">USD</span>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>STOP-LOSS</label>
        <div class="input-group">
            <input type="number" id="stopLoss" value="10" step="0.1">
            <span class="suffix">punkt</span>
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="spread">
        <label for="spread">Spredni hisobga olish</label>
    </div>

    <div class="price-info">
        <span>XAU/USD</span>
        <span>3737.90000</span>
    </div>

    <div class="result-box">
        <h3>NATIJA</h3>
        <div class="lot-result"><span id="resultLot">2,00</span> <span>lot</span></div>
        
        <div class="result-details">
            <span>Punkt qiymati</span>
            <span id="pointValue">1.00 USD</span>
        </div>
        <div class="result-details">
            <span>Samarali stop</span>
            <span id="effectiveStop">10.0 punkt</span>
        </div>
        <div class="result-details">
            <span>Hisoblangan risk</span>
            <span id="calculatedRisk">20.00 USD</span>
        </div>
    </div>

    <div class="warning">
        Brokerning minimal hajmi va qadami noma'lum.<br>
        Ko'rsatilgan hajmni ruxsat etilgan qadamgacha pastga yaxlitlang: yuqoriga yaxlitlash riskni oshiradi.
    </div>
</div>

<script>
    const accountSizeInput = document.getElementById('accountSize');
    const riskPercentInput = document.getElementById('riskPercent');
    const riskAmountInput = document.getElementById('riskAmount');
    const stopLossInput = document.getElementById('stopLoss');

    const resultLot = document.getElementById('resultLot');
    const pointValue = document.getElementById('pointValue');
    const effectiveStop = document.getElementById('effectiveStop');
    const calculatedRisk = document.getElementById('calculatedRisk');

    const valuePerPointPerLot = 1.00; 

    function calculate() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let riskAmount = parseFloat(riskAmountInput.value) || 0;
        let stopLoss = parseFloat(stopLossInput.value) || 1; 

        let lot = riskAmount / (stopLoss * valuePerPointPerLot);

        resultLot.textContent = lot.toFixed(2).replace('.', ',');
        effectiveStop.textContent = stopLoss.toFixed(1) + ' punkt';
        calculatedRisk.textContent = riskAmount.toFixed(2) + ' USD';
        
        let currentPointValue = lot * valuePerPointPerLot;
        pointValue.textContent = currentPointValue.toFixed(2) + ' USD';
    }

    riskPercentInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let newRiskAmount = (accountSize * riskPercent) / 100;
        riskAmountInput.value = newRiskAmount.toFixed(2);
        calculate();
    });

    riskAmountInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskAmount = parseFloat(riskAmountInput.value) || 0;
        if (accountSize > 0) {
            let newRiskPercent = (riskAmount / accountSize) * 100;
            riskPercentInput.value = newRiskPercent.toFixed(2);
        }
        calculate();
    });

    accountSizeInput.addEventListener('input', function() {
        let accountSize = parseFloat(accountSizeInput.value) || 0;
        let riskPercent = parseFloat(riskPercentInput.value) || 0;
        let newRiskAmount = (accountSize * riskPercent) / 100;
        riskAmountInput.value = newRiskAmount.toFixed(2);
        calculate();
    });

    stopLossInput.addEventListener('input', calculate);

    calculate();
</script>

</body>
</html>
